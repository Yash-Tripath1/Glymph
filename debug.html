<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Debug Test</title>
<style>
body { background: #000; color: #fff; font-family: monospace; padding: 20px; }
.sticker { position: absolute; left: 100px; top: 100px; }
.test-box { width: 200px; height: 200px; background: #ff3b2f; cursor: grab; }
.test-box:active { cursor: grabbing; }
.log { position: fixed; bottom: 20px; left: 20px; background: #111; padding: 10px; border: 1px solid #333; max-height: 300px; overflow-y: auto; }
</style>
</head>
<body>
<h1>Glymph Debug Test</h1>
<div id="log" class="log">
  <div>Loading...</div>
</div>

<div class="sticker" data-depth="26">
  <div class="test-box">DRAG ME</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/Draggable.min.js"></script>
<script>
const log = document.getElementById('log');
function addLog(msg) {
  const div = document.createElement('div');
  div.textContent = `${new Date().toLocaleTimeString()}: ${msg}`;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

addLog('Scripts loaded');
addLog('GSAP available: ' + (typeof gsap !== 'undefined'));
addLog('Draggable available: ' + (typeof Draggable !== 'undefined'));

if (typeof gsap !== 'undefined' && typeof Draggable !== 'undefined') {
  gsap.registerPlugin(Draggable);

  const sticker = document.querySelector('.sticker');
  addLog('Sticker found: ' + !!sticker);

  const drag = document.createElement('div');
  drag.className = 'sticker__drag';
  drag.style.cursor = 'grab';

  while (sticker.firstChild) {
    drag.appendChild(sticker.firstChild);
  }
  sticker.appendChild(drag);
  addLog('Wrapper created');

  try {
    Draggable.create(drag, {
      type: 'x,y',
      edgeResistance: 0.65,
      bounds: 'body',
      inertia: true,
      onDragStart: function() {
        addLog('Drag started!');
      },
      onDrag: function() {
        addLog('Dragging... x:' + Math.round(this.x) + ' y:' + Math.round(this.y));
      },
      onDragEnd: function() {
        addLog('Drag ended');
      }
    });
    addLog('Draggable initialized successfully!');
  } catch(e) {
    addLog('ERROR: ' + e.message);
  }
} else {
  addLog('ERROR: Required libraries not loaded');
}
</script>
</body>
</html>
